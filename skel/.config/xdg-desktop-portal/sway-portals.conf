[preferred]
# Use gtk for file pickers, text dialogues, and alerts
default=gtk
# Use GTK for app requests to inhibit idle, suspend, or logout
org.freedesktop.impl.portal.Inhibit=gtk
# Use wlr exclusively for screen sharing, recording, and screenshots
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
